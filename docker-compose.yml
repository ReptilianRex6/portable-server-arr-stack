# New-user defaults: UID/GID 1000 and UTC.
# Override PUID, PGID, and TZ in a .env file beside this file if needed.
# On the Linux host, use `id -u` and `id -g` to find your numeric IDs.
# Example timezone override: TZ=Europe/London
# /srv is the data root created by media-setup.sh; config folders are relative
# to this Compose file. Ensure the chosen user/group can access these paths.
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./radarr:/config
      - /srv:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./sonarr:/config
      - /srv:/data
    ports:
      - 8989:8989
    restart: unless-stopped
